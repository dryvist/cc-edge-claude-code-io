name: Test

on:
  pull_request:
    paths:
      - 'default/**'
      - 'data/samples/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/test.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Skip on the template repo itself; consumer repos have is_template: false.
    if: github.event.repository.is_template == false
    uses: dryvist/.github/.github/workflows/_cribl-pack-validate.yml@c4501ea67ce4469a5cc95216c9a989516da2adb8 # v1.10.0
    with:
      # CHANGE per pack: 'edge' for Cribl Edge packs, 'stream' for Cribl Stream packs.
      pack_type: edge
